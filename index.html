<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVAA</title>
<style>
  :root{--ink:#2a1e1b;--sub:#8c7269;--accent:#d8694f}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(177deg,#fcf1e9,#f8e0d6 55%,#f2d6e0);min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:12vh 24px 8vh;text-align:center}
  .orb{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle at 42% 36%,#f4a988,#e68e9e)}
  .wm{letter-spacing:6px;color:var(--sub);font-size:13px}
  h1{font-family:Georgia,serif;font-weight:300;font-size:40px;margin:.3em 0 .1em}
  .tag{font-family:Georgia,serif;font-size:22px;color:#c9a892;margin:0 0 1.4em}
  p{color:var(--sub);line-height:1.6}
  .links{margin-top:2.4em;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  a{color:var(--accent);text-decoration:none;font-weight:500}
  a:hover{text-decoration:underline}
  footer{margin-top:3em;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="orb"></div>
  <div class="wm">NOVAA</div>
  <h1>Fang neu an.</h1>
  <div class="tag">Ehrlich. Endlich.</div>
  <p>Kein Wischen. Keiner kauft sich vor. Nur Menschen, die wirklich passen könnten —
     eine ehrliche Art, jemanden kennenzulernen.</p>
  <h2 style="font-family:Georgia,serif;font-weight:300;margin-top:2em">Support</h2>
  <p>Fragen, Feedback oder ein Konto-Anliegen?<br>
     Schreib uns: <a href="mailto:blau.ton@icloud.com">blau.ton@icloud.com</a></p>
  <div class="links">
    <a href="privacy.html">Datenschutz</a>
    <a href="terms.html">Nutzungsbedingungen</a>
  </div>
  <footer>© 2026 NOVAA</footer>
</main>
</body>
</html>
